name: Semiconductor News Auto Crawler

on:
  schedule:
    # Auto run every 4 hours
    - cron: '0 */4 * * *'
  # Allow manual trigger of the workflow
  workflow_dispatch:

# Allow GitHub Actions to push changes back to the repository
permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Crawler & Process with Gemini
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: python main.py

    - name: Commit crawler logs
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add log
        git add failed_article.json added_article.json

        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Update crawler logs"
          git push
        fi
